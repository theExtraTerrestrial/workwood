# Builds the website (site/ plus the app's own page from ui/) and publishes it on GitHub Pages.
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'ui/**', 'shell/icon.svg', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
