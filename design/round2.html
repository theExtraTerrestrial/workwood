<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Agent manager — round 2: shell and composer</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#1b1c1f;color:#e8e9eb;font:13px/1.5 "Segoe UI",system-ui,sans-serif}
  [data-theme=light] body{background:#dcdee3;color:#17181b}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;position:sticky;top:0;z-index:5;background:inherit}
  .bar b{font-size:14px}.bar span{opacity:.6;flex:1}
  .bar button{padding:5px 12px;border-radius:7px;border:1px solid currentColor;opacity:.8}
  h3.sec{margin:14px 20px 2px;font-size:15px}
  p.sec{margin:0 20px 10px;opacity:.65}
  .grid{display:grid;gap:20px;padding:4px 20px 24px}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell{min-width:0}
  .cell h2{margin:0 0 2px;font-size:14px}.cell p{margin:0 0 8px;opacity:.65;font-size:12.5px;min-height:38px}
  .port{position:relative;overflow:hidden;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .zoomable .port{cursor:zoom-in}
  .port .win{transform-origin:0 0;transform:scale(var(--k,.5))}
  .cell.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .cell.zoom>h2,.cell.zoom>p{color:#fff;min-height:0}
  .cell.zoom .port{cursor:zoom-out}

  /* ---------- shared look (Native structure + Islands selection) ---------- */
  .hy{--hue:168;--font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --chrome:radial-gradient(560px 340px at 0 0,hsl(var(--hue) 62% 30%/.38),transparent 70%),linear-gradient(172deg,hsl(var(--hue) 26% 12%),hsl(calc(var(--hue) + 70) 16% 11%) 46%,#101114);
    --bg:#18191c;--tx:#f0f1f3;--dm:#a6aab2;--ft:#6d717a;--ln:rgba(255,255,255,.075);--sf:#222428;--sf2:#2c2f34;--wn:#ffb955;--go:#4fd6a4;--bdbg:#141a1b;
    --selbg:linear-gradient(180deg,rgba(255,255,255,.115),rgba(255,255,255,.065));--selsh:inset 0 1px 0 rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.25);
    --hi:rgba(255,255,255,.06);--edge:0 0 0 1px rgba(0,0,0,.5),-10px 0 30px rgba(0,0,0,.25);
    color:var(--tx);font:13px/1.5 var(--font);text-align:left}
  [data-theme=light] .hy{
    --chrome:radial-gradient(560px 340px at 0 0,hsl(var(--hue) 72% 78%/.7),transparent 70%),linear-gradient(172deg,hsl(var(--hue) 40% 91%),hsl(calc(var(--hue) + 70) 36% 93%) 46%,#eceef2);
    --bg:#ffffff;--tx:#17191d;--dm:#5a5f69;--ft:#9a9fa9;--ln:rgba(0,0,0,.085);--sf:#f2f3f6;--sf2:#e7e9ed;--wn:#b97400;--go:#0f9d77;--bdbg:#dcefec;
    --selbg:#ffffff;--selsh:inset 0 0 0 1px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.08);
    --hi:rgba(255,255,255,.9);--edge:0 0 0 1px rgba(0,0,0,.08),-10px 0 30px rgba(0,0,0,.06)}
  .hy svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
  .hy p{margin:0}
  .win{width:1120px;height:700px;display:flex;overflow:hidden;background:var(--chrome);position:relative}
  .sb{width:272px;flex:none;display:flex;flex-direction:column;padding:10px 8px}
  .sbh{display:flex;align-items:center;padding:4px 8px 6px}.sbh .ttl{flex:1;font-weight:600}
  .new{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--dm)}
  .g{display:flex;align-items:center;gap:7px;padding:16px 8px 6px;font-size:11.5px;font-weight:600;color:var(--dm)}
  .g em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;background:rgba(128,128,128,.2)}
  .it{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:11px}
  .it.sel{background:var(--selbg);box-shadow:var(--selsh)}
  .it.sel .bd{background:none}
  .tl{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:#fff;
      background:linear-gradient(160deg,hsl(var(--h) 70% 60%),hsl(calc(var(--h) + 25) 72% 45%));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.25)}
  .tl.s{width:20px;height:20px;font-size:8.5px;border-radius:6px}
  .bd{position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;border-radius:50%;background:var(--bdbg);display:none;align-items:center;justify-content:center}
  .wait .bd,.work .bd{display:flex}
  .wait .bd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--wn)}
  .work .bd::after{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ft);border-top-color:var(--go);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tx{flex:1;min-width:0}
  .a{display:flex;gap:8px;align-items:baseline}.a b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a time{font-size:11px;color:var(--ft)}
  .b{display:flex;gap:6px;font-size:11.5px;color:var(--ft);white-space:nowrap}.b em{font-style:normal;color:var(--dm)}.b span{overflow:hidden;text-overflow:ellipsis}
  .wait .b span{color:var(--wn)}
  .mn{flex:1;min-width:0;display:flex;flex-direction:column}
  .sheet{flex:1;min-height:0;display:flex;flex-direction:column}
  .hd{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 20px}
  .hd h1{font-size:14px;margin:0;font-weight:600;white-space:nowrap}
  .wh{display:flex;align-items:center;gap:6px;color:var(--dm);font-size:12.5px;margin-left:10px;white-space:nowrap}.wh svg{width:12px;height:12px}
  .sp{flex:1}
  .sg{display:flex;background:rgba(128,128,128,.16);border-radius:9px;padding:2px}
  .sg button{width:30px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--dm)}
  .sg .on{background:var(--selbg);color:var(--tx);box-shadow:var(--selsh)}
  .ic{height:28px;min-width:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--dm);border-radius:8px;font-size:12px}
  .cv{flex:1;overflow:hidden;padding:24px}
  .cl{max-width:640px;margin:0 auto}
  .u{margin:0 0 20px auto;width:fit-content;max-width:80%;background:linear-gradient(180deg,var(--sf2),var(--sf));box-shadow:inset 0 1px 0 var(--hi);border-radius:15px 15px 5px 15px;padding:9px 13px}
  .ag{margin-bottom:20px;font-size:13.5px;line-height:1.6}
  .ac{color:var(--ft);font-size:12px;margin-top:8px}
  .cds{display:flex;gap:10px;margin-top:12px}
  .cd{width:150px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--ln),0 4px 12px rgba(0,0,0,.14);background:var(--bg)}
  .th{height:84px;display:flex;align-items:center;justify-content:center}.th.l{background:#f5f6f8}.th.d{background:#14161a}.th.v{background:#060607;color:#fff}
  .th.v svg{fill:#fff;stroke:none;width:16px;height:16px}
  .mini{width:84px}.mini i{display:block;height:6px;border-radius:3px;margin:6px 0;background:#d9dce2}.mini i.x{width:44%;background:#1a9a7a}.th.d .mini i{background:#2a2e35}.th.d .mini i.x{background:#1a9a7a}
  .cp{padding:7px 9px}.cp b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cp span{font-size:11px;color:var(--ft)}
  .q{border:1px solid color-mix(in srgb,var(--wn) 32%,transparent);background:color-mix(in srgb,var(--wn) 8%,transparent);border-radius:13px;padding:13px 15px}
  .os{display:flex;gap:8px;margin-top:10px}
  .os button,.btn{padding:5px 12px;border-radius:8px;font-size:12.5px;background:linear-gradient(180deg,var(--sf2),var(--sf));box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--ln),0 1px 2px rgba(0,0,0,.12)}
  .os button:first-child,.btn.pri{background:var(--tx);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}

  /* shells */
  .s1 .mn{background:var(--bg);box-shadow:var(--edge)}
  .s1 .hd{border-bottom:1px solid var(--ln)}
  .s2 .mn{background:var(--bg);margin-top:8px;border-radius:13px 0 0 0;box-shadow:var(--edge)}
  .s2 .hd{border-bottom:1px solid var(--ln)}
  .s3 .sheet{background:var(--bg);border-radius:13px 0 0 0;box-shadow:var(--edge)}
  .s3 .hd{padding-left:8px}

  /* ---------- composers ---------- */
  .cm{padding:8px 24px 18px;flex:none}
  .bx{max-width:640px;margin:0 auto}
  .ph{color:var(--ft);display:block}
  .rw{display:flex;align-items:center;gap:2px}
  .sd{width:30px;height:30px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .sd svg{stroke-width:2.2}
  .raised{background:linear-gradient(180deg,var(--sf2),var(--sf));box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--ln),0 2px 6px rgba(0,0,0,.14)}

  /* C1 two rows */
  .c1 .bx{border-radius:15px;padding:13px 10px 9px 15px}
  .c1 .ph{height:40px}.c1 .rw{margin-left:-7px}
  /* C2 docked */
  .cm.c2{padding:0;background:var(--sf);border-top:1px solid var(--ln);box-shadow:inset 0 1px 0 var(--hi)}
  .c2 .bx{max-width:none;display:flex;align-items:flex-end;gap:6px;padding:14px 14px 14px 22px}
  .c2 .ph{flex:1;min-height:46px}
  /* C3 voice first */
  .c3 .bx{border-radius:18px;padding:9px 10px 9px 9px;display:flex;align-items:center;gap:12px}
  .c3 .mc{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
          background:linear-gradient(160deg,hsl(var(--hue) 62% 46%),hsl(calc(var(--hue) + 45) 62% 42%));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.25)}
  .c3 .mc svg{width:19px;height:19px}
  .c3 .ph{flex:1}.c3 .ph small{display:block;font-size:11px;opacity:.8;margin-top:1px}
  /* C4 toolbar on top */
  .c4 .bx{border-radius:13px;overflow:hidden}
  .c4 .tb{display:flex;align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--ln);background:rgba(128,128,128,.07)}
  .c4 .ph{padding:11px 14px 0;height:44px}
  .c4 .ft{display:flex;align-items:center;padding:6px 8px 8px 14px;font-size:11.5px;color:var(--ft)}
  .c4 .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;padding:5px 11px}
  .c4 .btn kbd{font:inherit;font-weight:400;opacity:.6}

  /* composer showcase crop */
  .crop{background:var(--bg);padding-top:22px;height:226px;display:flex;flex-direction:column;justify-content:flex-end}
  .crop .tail{max-width:640px;margin:0 auto 14px;width:calc(100% - 48px);font-size:13.5px;color:var(--dm)}
</style>
</head>
<body>
<div class="bar"><b>Round 2</b><span>Native's solid structure with Islands' raised selection, no blue. Two things to choose.</span><button id="theme">Switch to light</button></div>

<h3 class="sec">1 · How the sidebar and the main area join</h3>
<p class="sec">Click a frame to enlarge it. All three use composer C1 for now.</p>
<div class="grid g3 zoomable" id="shells"></div>

<h3 class="sec">2 · Composer</h3>
<p class="sec">Shown at real size.</p>
<div class="grid g2" id="comps"></div>

<script>
const P={
  plus:'<path d="M12 5v14M5 12h14"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  term:'<path d="m4 17 6-6-6-6M12 19h8"/>',
  diff:'<path d="M12 4v8M8 8h8M8 18h8"/>',
  code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  clip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  branch:'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  play:'<path d="M6 4l14 8-14 8z"/>'
};
const s=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const ic=n=>`<button class="ic">${s(n)}</button>`;
const send=`<button class="sd">${s('up')}</button>`;

const comp={
  c1:`<div class="cm c1"><div class="bx raised"><span class="ph">Message the agent…</span><div class="rw">${ic('clip')}<span class="sp"></span>${ic('mic')}${send}</div></div></div>`,
  c2:`<div class="cm c2"><div class="bx"><span class="ph">Message the agent…</span>${ic('clip')}${ic('mic')}${send}</div></div>`,
  c3:`<div class="cm c3"><div class="bx raised"><button class="mc">${s('mic')}</button><span class="ph">Speak or type…<small>Click the mic to dictate</small></span>${ic('clip')}${send}</div></div>`,
  c4:`<div class="cm c4"><div class="bx raised"><div class="tb">${ic('clip')}${ic('mic')}</div><span class="ph">Message the agent…</span><div class="ft"><span>Enter to send · Shift+Enter for a new line</span><span class="sp"></span><button class="btn pri">Send <kbd>⏎</kbd></button></div></div></div>`
};

const it=(cls,h,m,t,a,p,l)=>`<div class="it ${cls}" style="--h:${h}"><span class="tl">${m}<i class="bd"></i></span><span class="tx"><span class="a"><b>${t}</b><time>${a}</time></span><span class="b"><em>${p}</em><span>${l}</span></span></span></div>`;
const mini='<div class="mini"><i class="x"></i><i></i><i></i><i class="x"></i></div>';
const win=c=>`<div class="win hy ${c}">
  <aside class="sb">
    <div class="sbh"><span class="ttl">Sessions</span><button class="new">${s('plus')}</button></div>
    <div class="g">erhards2<em>global</em></div>
    ${it('wait sel',168,'WS','Checkout redesign','now','waystone','Which direction should I implement?')}
    ${it('work',262,'RE','Invoice PDF export','12m','realizacija','Editing invoice_pdf.rb')}
    ${it('idle',342,'ES','Fix flaky signing spec','1d','esign','Done · 3 files changed')}
    <div class="g">erhards</div>
    ${it('work',36,'CL','Usage card animation','3m','claudius','Running tests')}
    ${it('idle',168,'WS','Onboarding empty states','2h','waystone','Done · 5 mockups')}
    <div class="g">axius</div>
    ${it('idle',208,'IP','Translate admin panel','2d','i18n_panel','Stopped at 61 of 140 keys')}
  </aside>
  <section class="mn">
    <header class="hd"><h1>Checkout redesign</h1><span class="wh" style="--h:168"><span class="tl s">WS</span>waystone ${s('branch')} checkout-redesign</span><span class="sp"></span>
      <div class="sg"><button class="on">${s('chat')}</button><button>${s('term')}</button></div><button class="ic">${s('diff')}7</button>${ic('code')}</header>
    <div class="sheet">
      <div class="cv"><div class="cl">
        <div class="u"><p>Two directions for the payment step: one light and minimal, one dark that matches the dashboard. Show me both first.</p></div>
        <div class="ag"><p>I built both directions as standalone mockups, and recorded the dark one going through a declined-card flow so you can see the error state in motion.</p>
          <div class="ac">▸ Read 2 files, wrote 3</div>
          <div class="cds">
            <div class="cd"><div class="th l">${mini}</div><div class="cp"><b>payment-light.html</b><span>Direction A</span></div></div>
            <div class="cd"><div class="th d">${mini}</div><div class="cp"><b>payment-dark.html</b><span>Direction B</span></div></div>
            <div class="cd"><div class="th v">${s('play')}</div><div class="cp"><b>card-declined.webm</b><span>0:18</span></div></div>
          </div></div>
        <div class="q"><p>Which direction should I implement in the real checkout views?</p><div class="os"><button>A · Light</button><button>B · Dark</button><button>Keep iterating</button></div></div>
      </div></div>
      ${comp.c1}
    </div>
  </section>
</div>`;

const shells=[
  ['s1','S1 · Flush','Sidebar and main area meet edge to edge. The main area is one solid surface; only the sidebar carries the tint.'],
  ['s2','S2 · Sheet','The main area is a solid sheet with one rounded corner, attached to the right and bottom edges. The tint shows above it.'],
  ['s3','S3 · Toolbar in the frame','The title and controls sit in the tinted frame with the sidebar; only the conversation is on the sheet.']
];
document.getElementById('shells').innerHTML=shells.map(([c,t,d])=>`<div class="cell"><h2>${t}</h2><p>${d}</p><div class="port">${win(c)}</div></div>`).join('');

const comps=[
  ['c1','C1 · Two rows','Text on top, controls underneath: attach on the left, mic and send on the right. Solid and raised rather than floating.'],
  ['c2','C2 · Docked','Not a box at all: a band fixed to the bottom of the window, edge to edge, with the controls in line.'],
  ['c3','C3 · Voice first','A large mic button leads, since you dictate a lot. Text in the middle, attach and send on the right.'],
  ['c4','C4 · Toolbar on top','A thin tool strip above the text, and a labelled Send button with the keyboard hint below.']
];
document.getElementById('comps').innerHTML=comps.map(([c,t,d])=>`<div class="cell"><h2>${t}</h2><p>${d}</p><div class="port"><div class="crop hy"><div class="tail">…so you can see the error state in motion.</div>${comp[c]}</div></div></div>`).join('');

function fit(){
  document.querySelectorAll('#shells .cell').forEach(c=>{
    const p=c.querySelector('.port');let k;
    if(c.classList.contains('zoom')) k=Math.min((innerWidth-32)/1120,(innerHeight-90)/700);
    else{p.style.width='';k=c.clientWidth/1120}
    p.style.setProperty('--k',k);p.style.width=1120*k+'px';p.style.height=700*k+'px';
  });
}
document.getElementById('shells').onclick=e=>{const c=e.target.closest('.cell');if(!c)return;const z=c.classList.contains('zoom');document.querySelectorAll('.cell').forEach(x=>x.classList.remove('zoom'));if(!z)c.classList.add('zoom');fit()};
addEventListener('resize',fit);
const root=document.documentElement,tb=document.getElementById('theme');
const setTheme=t=>{root.dataset.theme=t;tb.textContent=t=='dark'?'Switch to light':'Switch to dark'};
tb.onclick=()=>setTheme(root.dataset.theme=='dark'?'light':'dark');
setTheme(location.hash.includes('light')?'light':'dark');
fit();
const z=location.hash.match(/z(\d)/);if(z){document.getElementById('shells').children[+z[1]].classList.add('zoom');fit()}
</script>
</body>
</html>
