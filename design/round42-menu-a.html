<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Round 42 menu — A · Model in the subline</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"><style>
:root{color-scheme:dark;--accent:hsl(168 62% 62%);--warn:#ffb955;--bg:#18191c;--surface:#222428;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--text:#f0f1f3;--dim:#a6aab2;--faint:#6d717a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:13px/1.5 Manrope,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
.wrap{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lbl{align-self:flex-start;font-size:12px;color:var(--faint);max-width:364px}.lbl b{color:var(--text)}
.pop{width:364px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px 12px 8px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.big{display:flex;align-items:baseline;gap:6px;padding:0 4px}.big b{font-size:22px;font-weight:750}.big span,.big em{color:var(--faint);font-size:12px;font-style:normal}.big em{margin-left:auto}
.bar{display:flex;gap:2px;height:6px;margin:9px 4px 7px}.bar i{border-radius:3px}.bar i:last-child{flex:1;background:rgba(128,128,128,.18)}
.lg{display:flex;gap:12px;padding:0 4px 10px;font-size:11px;color:var(--faint);border-bottom:1px solid var(--line)}
.lg span{display:inline-flex;align-items:center;gap:5px}.lg span::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.act{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:9px;margin-top:4px;font-size:12.5px;font-weight:650}
.act:hover{background:rgba(128,128,128,.1)}
.ic{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:rgba(128,128,128,.13);color:var(--dim)}
.pri .ic{background:hsl(168 62% 62%/.16);color:var(--accent)}
.ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm{flex:1;min-width:0;white-space:nowrap}.nm small{display:block;font-weight:500;font-size:11.5px;color:var(--faint);margin-top:1px}
.lk{color:var(--dim);text-decoration:underline;text-decoration-color:rgba(128,128,128,.45);text-underline-offset:2px;cursor:pointer}
.lk:hover{color:var(--accent);text-decoration-color:currentColor}
.cv{display:inline-block;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:5px;opacity:.7}
.pills{display:flex;gap:4px;margin:6px 0 2px 42px}
.pills button{padding:3px 10px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--dim);background:rgba(128,128,128,.12)}
.pills button.on{background:hsl(168 62% 62%/.16);color:var(--accent)}
.pills .sep{width:1px;background:var(--line2);margin:3px 4px}
.hov .pills{max-height:0;overflow:hidden;opacity:0;transition:.2s;margin-top:0}
.hov:hover .pills,.hov.on .pills{max-height:40px;opacity:1;margin-top:6px}
.row{border-radius:9px;padding-bottom:4px}.row:hover{background:rgba(128,128,128,.06)}
.row .act:hover{background:none}
.cfm{display:none;margin:4px 6px 6px 42px}.exp.on .cfm{display:block}.exp.on{background:rgba(128,128,128,.07)}
.go{margin-top:8px;padding:5px 12px;border-radius:8px;background:var(--accent);color:#0b1714;font-weight:700;font-size:12px}
.mods{display:flex;gap:6px}.mods button{flex:1;padding:6px 8px;border-radius:9px;background:rgba(128,128,128,.1);font-size:12px;font-weight:650}
.mods button small{display:block;font-weight:500;color:var(--faint);font-size:10.5px}
.mods button.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:hsl(168 62% 62%/.08)}
.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:6px}
</style></head><body><div class="wrap"><div class="lbl"><b>A · Model in the subline</b><br>The model is a quiet link inside the line underneath. The row continues; the link changes the model.</div><div class="pop"><div class="big"><b>312k</b><span>of 1M</span><em>31%</em></div>
<div class="bar"><i style="width:26%;background:var(--accent)"></i><i style="width:13%;background:var(--warn)"></i><i style="width:7%;background:var(--dim)"></i><i></i></div>
<div class="lg"><span style="--c:var(--accent)">Tool results</span><span style="--c:var(--warn)">Talk</span><span style="--c:var(--dim)">Files</span></div><button class="act pri"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6"/></svg></span><span class="nm">Continue in a new session<small>Handoff by <span class="lk" onclick="event.stopPropagation()">Sonnet · medium<i class="cv"></i></span></small></span></button><button class="act"><span class="ic"><svg viewBox="0 0 24 24"><path d="M8 4v5H3M16 20v-5h5M4 9l5-5M20 15l-5 5"/></svg></span><span class="nm">Summarise to make room<small>Compact · earlier detail fades</small></span></button></div></div><script>document.querySelectorAll(".exp .act").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("on"));document.querySelectorAll(".pills,.mods").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();const grp=[...g.children];const i=grp.indexOf(b),s=grp.findIndex(x=>x.classList&&x.classList.contains("sep"));grp.filter((x,j)=>x.tagName==="BUTTON"&&(s<0||(i<s?j<s:j>s))).forEach(x=>x.classList.toggle("on",x===b))})</script></body></html>
