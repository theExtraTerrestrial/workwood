<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-token="__TOKEN__">
<div class="app">
  <aside class="side">
    <div class="side-head"><span>Sessions</span></div>
    <div class="prog" id="prog"></div>
    <div class="list" id="list"></div>
    <div class="side-foot"><button class="newb" id="newBtn"><i data-i="plus"></i>New session</button><button class="ib" id="bGear" title="Settings" data-i="cog"></button></div>
  </aside>

  <section class="main" id="main">
    <header class="head">
      <h1 id="title"></h1><div class="where" id="where"></div>
      <div id="tools" style="display:flex;align-items:center;gap:4px">
        <div class="seg" id="seg">
          <button class="ib on" id="vChat" title="Chat" data-i="chat"></button>
          <button class="ib" id="vTerm" title="Terminal" data-i="term"></button>
        </div>
        <button class="ib" id="bSkills" title="Skills in this session" data-i="zap"></button>
        <button class="ib wide" id="bChanges" title="Changes" hidden><i data-i="diff"></i><span id="chN"></span></button>
        <button class="ib" id="bCode" title="Open in VS Code" data-i="code"></button>
      </div>
    </header>

    <div class="split" id="split">
      <section class="conv" id="conv">
        <div class="scroll" id="scroll">
          <div class="col" id="thread"></div>
          <div class="hello" id="hello" hidden>What should the agent do?</div>
        </div>
        <div class="composer">
          <div class="qcard" id="qcard" hidden></div>
          <div class="box" id="box">
            <div class="inl" id="slash" hidden></div>
            <div class="atts" id="atts" hidden></div>
            <textarea id="input" rows="1" placeholder="Message the agent…"></textarea>
            <div class="row">
              <button class="ib" id="bAttach" title="Attach files" data-i="clip"></button><span id="fchips" style="display:contents"></span><input type="file" id="filePick" multiple hidden>
              <span class="slot" id="sProject" hidden>
                <button class="pick" id="pProject" title="Project"></button>
                <div class="pop" id="mProject" hidden></div>
              </span>
              <span class="slot" id="sProfile" hidden>
                <button class="pick" id="pProfile" title="Profile"></button>
                <div class="pop" id="mProfile" hidden></div>
              </span>
              <span class="gap"></span>
              <span class="voice" id="voice" hidden><button class="ib" id="vCancel" data-tip="Discard this dictation (Esc)" data-i="x"></button><span class="wave" id="wave"></span><span id="vtime">0:00</span></span>
              <button class="ib" id="mic" data-tip="Dictate: click to start and stop, or hold while you speak" data-i="mic"></button>
              <button class="send" id="send" title="Send" data-i="up"></button>
            </div>
          </div>
          <div class="support"><span class="slot"><button class="pick" id="pModel" title="Model"></button><div class="pop sm" id="mModel" hidden></div></span><span class="slot"><button class="pick" id="pEffort" title="Effort"></button><div class="pop sm" id="mEffort" hidden></div></span><span class="gap"></span><span class="ctx" id="pCtx" title="Context used"></span><div class="bar3" id="ctxBar"><i></i></div></div>
          <div class="oops" id="oops" hidden></div>
        </div>
      </section>
      <section class="term" id="term" hidden><div class="xt" id="xt"></div><div class="tnote" id="tnote" hidden></div></section>
      <aside class="panel" id="panel" hidden>
        <div class="pwrap" id="pvw">
        <div class="phead">
          <button class="ib" id="pPrev" title="Previous" data-i="chev-l"></button><button class="ib" id="pNext" title="Next" data-i="chev-r"></button>
          <button class="ptitle" id="moreBtn" title="All work from this session"><span id="pName"></span><i data-i="chev-d"></i></button><span class="pcnt" id="pCnt"></span>
          <span class="gap"></span>
          <button class="ib" id="bRefresh" title="Refresh" data-i="refresh"></button>
          <button class="ib" id="bFull" title="Full width" data-i="max"></button>
          <button class="ib" id="bExt" title="Open in browser" data-i="ext"></button>
          <button class="ib" id="bClose" title="Close" data-i="x"></button>
          <div class="menu" id="menu" hidden></div>
        </div>
        <div class="stage" id="stage"></div>
        </div>
        <div class="pwrap" id="skw" hidden>
          <div class="phead"><span class="ctitle" id="skT">Skills</span><span class="gap"></span><button class="ib" id="skClose" title="Close" data-i="x"></button></div>
          <label class="find skf"><i data-i="search"></i><input id="skQ" placeholder="Search skills" autocomplete="off" spellcheck="false"></label>
          <div class="ol" id="skl"></div>
        </div>
        <div class="pwrap" id="chw" hidden>
          <div class="phead"><span class="ctitle" id="chT"></span><span class="cstat mono" id="chS"></span><span class="gap"></span><button class="ib" id="chRefresh" title="Refresh" data-i="refresh"></button><button class="ib" id="chClose" title="Close" data-i="x"></button></div>
          <div class="files mono" id="files"></div>
          <div class="diff mono" id="diff"></div>
        </div>
      </aside>
    </div>
  </section>
</div>
<div class="fmenu" id="gmenu" hidden style="width:220px"><button id="gTheme">Theme<span id="gThemeV"></span></button><button id="gArch">Archived sessions<span id="gArchV"></span></button><hr><button id="gAll">All settings…</button></div>
<div class="fmenu" id="smenu" hidden></div>
<div class="dim" id="sdim" hidden><div class="dlg" id="dlg"><div class="dtabs"><h3>Settings</h3><div id="stabs"></div></div><div class="pg"><button class="ib cls" id="dClose" title="Close" data-i="x"></button><div id="spage"></div></div></div></div>
<div class="tip2" id="tip" hidden></div>
<div class="dim" id="dim" hidden><div class="ask" id="ask"></div></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
